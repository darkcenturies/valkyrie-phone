name: Phone checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install page builder
        run: |
          python -m pip install Pillow playwright
          python -m playwright install chromium
      - name: Verify generated map builder
        run: python valkyrie-asi-suite/tools/make-phone-map-builder.py --check
      - name: Verify both icon sets
        run: python valkyrie-asi-suite/tools/test-phone-icon-sets.py
      - name: Build x86 phone with authored offline SA pages
        shell: powershell
        run: ./valkyrie-asi-suite/build.ps1 -Release
      - name: Verify shipped browser inventory (no GTA IV or archive pages)
        run: |
          python -c "import runpy; from pathlib import Path; m=runpy.run_path('valkyrie-asi-suite/valkyrie-phone/tools/iv-web/build-web-pack.py'); pages=m['read_pack']('valkyrie-asi-suite/build/valkyrie-web.dat'); expected={k for k,_,_ in m['sa_pages']()}; assert len(pages)==8 and {p['key'] for p in pages}==expected; print('Ships eight authored SA pages; no GTA IV or archived pages.')"
      - name: Check icon recovery
        shell: powershell
        run: ./valkyrie-asi-suite/tools/test-phone-ui.ps1
      - name: Map tile retention during rapid panning
        shell: powershell
        run: ./valkyrie-asi-suite/tools/test-map-tile-cache.ps1
      - name: Radar water footprint regression
        shell: powershell
        run: ./valkyrie-asi-suite/tools/test-radar-water.ps1
      - name: Phone action transition regression
        shell: powershell
        run: ./valkyrie-asi-suite/tools/test-phone-actions.ps1
      - name: Pre-HUD reflection regression
        shell: powershell
        run: ./valkyrie-asi-suite/tools/test-phone-reflection.ps1
      - name: Device reset shim regression
        shell: powershell
        run: ./valkyrie-asi-suite/tools/test-device-hooks.ps1
      - name: Phone weapon type regression
        shell: powershell
        run: ./valkyrie-asi-suite/tools/test-phone-weapon.ps1
      - name: Stage downloadable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force build/ci-package | Out-Null
          Copy-Item -LiteralPath "valkyrie-asi-suite/build/valkyrie-phone.asi" -Destination build/ci-package
          python valkyrie-asi-suite/tools/phone-default-ini.py build/ci-package/valkyrie-phone.ini
          if ($LASTEXITCODE -ne 0) { throw "Default ini generation failed." }
          Copy-Item -LiteralPath LICENSE, THIRD_PARTY_NOTICES.md -Destination build/ci-package
      - name: Include verified stock map and optional weapon configs
        shell: powershell
        run: |
          ./valkyrie-asi-suite/tools/stage-phone-content.ps1 -Output build/ci-package
      - name: Publish merged build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: valkyrie-phone-gta-sa-1.0-${{ github.sha }}
          path: build/ci-package/
          if-no-files-found: error
          retention-days: 30
      - name: Publish complete merged build to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path valkyrie-asi-suite/valkyrie-core/src/version.h -Pattern 'VALKYRIE_PHONE_VERSION "([^"]+)"').Matches.Groups[1].Value
          $archive = "valkyrie-phone-gta-sa-1.0-full.zip"
          & 'C:\Program Files\7-Zip\7z.exe' a -tzip -mx=5 "build/$archive" './build/ci-package/*' -bsp0 -bso0
          if ($LASTEXITCODE -ne 0) { throw 'Full install archive failed.' }
          & 'C:\Program Files\7-Zip\7z.exe' t "build/$archive" -bsp0 -bso0
          if ($LASTEXITCODE -ne 0) { throw 'Full install archive verification failed.' }
          @"
          valkyrie phone $version for GTA San Andreas 1.0 US.

          Download **$archive** for the full installation: phone ASI, default INI, 144 generated stock map tile pairs, optional weapon model/configs, optional map builder, README and credits.

          Optional weapon mode requires Modloader 0.3.10 and fastman92 7.6 installed separately. Its configurations are already prepared; copy the supplied game-folder files. Internet includes eight authored offline SA pages. GTA IV page packs remain personal local build inputs.

          Reuses GTA SA animation blocks for phone actions and native calls. The handset appears when right-click raises the tucked phone UI. IconSize=16 is the default pixel artwork; IconSize=64 selects the older detailed set. The original Settings wrench stays unchanged.

          The phone captures its reflection before the HUD, keeping the radar and other HUD overlays out of the glass.
          "@ | Set-Content build/release-notes.md
          gh release create "build-$env:GITHUB_SHA" "build/$archive" --target $env:GITHUB_SHA --title "valkyrie phone $version - GTA SA 1.0" --notes-file build/release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Merged build release publication failed.' }
